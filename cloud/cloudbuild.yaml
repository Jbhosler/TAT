steps:
  # Build the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tat-backend:${BUILD_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tat-backend:latest'
      - '-f'
      - 'cloud/Dockerfile'
      - '.'
    id: 'build-backend'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tat-backend:${BUILD_ID}'
    id: 'push-backend-versioned'
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/tat-backend:latest'
    id: 'push-backend-latest'
    waitFor: ['build-backend']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tat-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/tat-backend:${BUILD_ID}'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION_NAME}'
      - '--set-env-vars'
      - 'GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=us-central1,ENVIRONMENT=production,DB_HOST=tat-db-instance,USE_CLOUD_SQL_PROXY=false'
      - '--set-secrets'
      - 'DB_NAME=db-name:latest,DB_USER=db-user:latest,DB_PASSWORD=db-password:latest'
      - '--service-account'
      - '${PROJECT_NUMBER}-compute@developer.gserviceaccount.com'
    id: 'deploy-backend'
    waitFor: ['push-backend-versioned']

images:
  - 'gcr.io/$PROJECT_ID/tat-backend:${BUILD_ID}'
  - 'gcr.io/$PROJECT_ID/tat-backend:latest'

substitutions:
  _CLOUD_SQL_CONNECTION_NAME: 'tax-aware-transition-tool:us-central1:tat-db-instance'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
