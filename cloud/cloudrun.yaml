apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tat-backend
  annotations:
    run.googleapis.com/cloudsql-instances: tax-aware-transition-tool:us-central1:tat-db-instance
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/tax-aware-transition-tool/tat-backend:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: GCP_PROJECT_ID
          value: tax-aware-transition-tool
        - name: GCP_REGION
          value: us-central1
        - name: ENVIRONMENT
          value: production
        - name: DB_HOST
          value: tax-aware-transition-tool:us-central1:tat-db-instance
        - name: USE_CLOUD_SQL_PROXY
          value: "false"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-name
              key: latest
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-user
              key: latest
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: latest
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "1"
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
